<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Nuevo SUS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body data-entity="sus" data-mode="nuevo">
  <div id="global-nav" class="global-nav"></div>
  <svg class="svg-sprite" width="0" height="0" aria-hidden="true">
    <symbol id="chev" viewBox="0 0 12 12">
      <path d="M2 4l4 4 4-4" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="x" viewBox="0 0 24 24">
      <path d="M5 5l14 14M19 5L5 19" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    </symbol>
  </svg>
  <main id="app" class="app-shell"></main>
<template id="t0"><div class="group"><div class="lbl-lg">Termino Preferido (P) <span class="req">*</span></div><div class="tp-row"><div class="input"></div><span class="chip">min</span><span class="man">Man.</span></div></div>
<div class="sep"></div><div class="syn-title">Agregar sinonimo</div>
<div class="syn-row"><div class="input">Nuevo termino...</div><div class="select" class="u19"><span>Sinonimo</span><svg><use href="#chev"/></svg></div><div class="plus">+</div></div>
<div class="hint">CREAC_NOMBRE = M (manual) · SENS_MAYUSC se auto-detecta</div></template>

<template id="t1"><div class="group"><div class="lbl">Riesgo teratogenico <span class="req">*</span></div><div class="select error"><span>-- Seleccionar riesgo --</span><svg><use href="#chev"/></svg></div><div class="error-text">El riesgo teratogenico es obligatorio</div></div></template>

<template id="t2"><div class="row">
<div class="field"><div class="lbl">Revisado</div><div class="select"><span>No</span><svg><use href="#chev"/></svg></div></div>
<div class="field"><div class="lbl">Consultar</div><div class="select"><span>No</span><svg><use href="#chev"/></svg></div></div>
<div class="field"><div class="lbl">Estado</div><div class="select"><span>Activo</span><svg><use href="#chev"/></svg></div></div>
<div class="field"><div class="lbl">Comercializado</div><div class="select"><span>Si</span><svg><use href="#chev"/></svg></div></div></div>
<div class="group"><div class="lbl">Observacion</div><div class="textarea"></div></div></template>

<template id="t3"><div class="empty">Sin mapeos registrados</div><div class="sep"></div><div class="sec-title">Agregar Mapeo</div>
<div class="group"><div class="lbl">Terminologia</div><div class="select"><span>-- Seleccionar terminologia --</span><svg><use href="#chev"/></svg></div></div></template>

<template id="t4"><div class="empty">Sin etiquetas asociadas</div><div class="sep"></div><div class="sec-title">Agregar Etiqueta</div>
<div class="group"><div class="lbl">Etiqueta</div><div class="input narrow">Buscar etiqueta vigente (</div><div class="btn-add">Agregar</div></div></template>
  <script src="../js/app.js"></script>
</body>
</html>
