<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Nuevo VTM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body data-entity="vtm" data-mode="nuevo">
  <div id="global-nav" class="global-nav"></div>
  <svg class="svg-sprite" width="0" height="0" aria-hidden="true">
    <symbol id="chev" viewBox="0 0 12 12">
      <path d="M2 4l4 4 4-4" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="x" viewBox="0 0 24 24">
      <path d="M5 5l14 14M19 5L5 19" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    </symbol>
  </svg>
  <main id="app" class="app-shell"></main>
<template id="t0"><div class="group"><div class="lbl-lg">Termino Preferido (P) — auto-generado <span class="req">*</span></div>
<div class="tp-row"><div class="input auto">(complete los datos para generar el nombre)</div><span class="chip">min</span><div class="sel-mini"><span>Auto</span><svg><use href="#chev"/></svg></div><span class="note-i">Siempre auto — el nombre se compone con el distintivo</span></div></div>
<div class="group"><div class="lbl-lg">Distintivo</div><div class="input dis">Texto que desambigua el nombre auto (comodin / colision)...</div></div>
<div class="esp">Especial (comodin): <b>No</b></div>
<div class="sep"></div><div class="syn-title">Agregar sinonimo</div>
<div class="syn-row"><div class="input">Nuevo termino...</div><div class="select" class="u27"><span>Sinonimo</span><svg><use href="#chev"/></svg></div><div class="plus">+</div></div>
<div class="hint">CREAC_NOMBRE = M (manual) · SENS_MAYUSC se auto-detecta</div></template>

<template id="t1"><div class="group"><div class="lbl">Especial (comodin)</div><div class="select"><span>No (estandar)</span><svg><use href="#chev"/></svg></div></div>
<div class="group"><div class="lbl">Separador de sustancias</div><div class="select"><span>-- Sin separador (monosustancia) --</span><svg><use href="#chev"/></svg></div></div>
<div class="group"><div class="lbl">Sustancias (0) <span class="req">*</span></div>
<div class="infobox">ℹ El VTM <b>define el orden</b> de las sustancias. Si lo cambiás, al guardar se propaga el orden y el nombre a todos los VMP, VMPP, AMP y AMPP estándar de esta familia. Usá <b>Calcular Impacto</b> para ver los cambios antes de confirmar.</div></div>
<div class="sep"></div><div class="input dis">Buscar sustancia...</div></template>

<template id="t2"><div class="row">
<div class="field"><div class="lbl">Revisado</div><div class="select"><span>No</span><svg><use href="#chev"/></svg></div></div>
<div class="field"><div class="lbl">Consultar</div><div class="select"><span>No</span><svg><use href="#chev"/></svg></div></div>
<div class="field"><div class="lbl">Estado</div><div class="select"><span>Activo</span><svg><use href="#chev"/></svg></div></div>
<div class="field"><div class="lbl">Comercializado</div><div class="select ro"><span>Si</span></div><div class="orange">Derivado: se enciende solo si algún hijo activo está comercializado. Se edita únicamente en el AMPP.</div></div></div>
<div class="group"><div class="lbl">Observacion</div><div class="textarea"></div></div></template>

<template id="t3"><div class="empty">Sin mapeos registrados</div><div class="sep"></div><div class="sec-title">Agregar Mapeo</div>
<div class="group"><div class="lbl">Terminologia</div><div class="select"><span>-- Seleccionar terminologia --</span><svg><use href="#chev"/></svg></div></div></template>

<template id="t4"><div class="empty">Sin etiquetas asociadas</div><div class="sep"></div><div class="sec-title">Agregar Etiqueta</div>
<div class="group"><div class="lbl">Etiqueta</div><div class="input narrow">Buscar etiqueta vigente (</div><div class="btn-add">Agregar</div></div></template>
  <script src="../js/app.js"></script>
</body>
</html>
